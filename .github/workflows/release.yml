name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: release-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'stoicpickle/prooflantern'
        with:
          key: release-${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          package="proof-lantern-v${version}-${{ matrix.target }}"
          mkdir "${package}"
          cp "target/${{ matrix.target }}/release/proof-lantern" "${package}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${package}/"
          tar -czf "${package}.tar.gz" "${package}"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "could not read version from Cargo.toml" }
          $version = $match.Matches[0].Groups[1].Value
          $package = "proof-lantern-v$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\proof-lantern.exe" "$package\"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "$package\"
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: runner.os != 'Windows'
        with:
          name: proof-lantern-${{ matrix.target }}
          path: proof-lantern-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: runner.os == 'Windows'
        with:
          name: proof-lantern-${{ matrix.target }}
          path: proof-lantern-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: publish-attested-release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'stoicpickle/prooflantern'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: proof-lantern-*
          path: dist
          merge-multiple: true
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum proof-lantern-*.tar.gz proof-lantern-*.zip > SHA256SUMS
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes --title "Proof Lantern ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${release_flags[@]}"
