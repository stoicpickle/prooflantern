[package]
name = "proof-lantern"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An evidence-backed visual completeness map for software projects"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/stoicpickle/prooflantern"
publish = false

[features]
terminal-test-hooks = []

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.1.0"
serde_json = "1.0.151"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.48.0"
portable-pty = "0.9.0"
